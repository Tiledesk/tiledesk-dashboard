<div class="ms365-acc-header">
  <h1 mat-dialog-title class="ms365-acc-title">{{ 'KbPage.Ms365Accounts' | translate }}</h1>
  <button type="button" class="ms365-acc-close" (click)="close()" [attr.aria-label]="'Close' | translate">
    <span class="material-icons-outlined">close</span>
  </button>
</div>
<div mat-dialog-content class="ms365-acc-content">
  <p class="ms365-acc-intro">{{ 'KbPage.Ms365AccountsIntro' | translate }}</p>
  <kb-ms365-connections view="list" (changed)="onChanged($event)"></kb-ms365-connections>
</div>
<div mat-dialog-actions class="ms365-acc-actions">
  <button class="mat-dialog-close-btn" mat-button (click)="close()">{{ 'Close' | translate }}</button>
</div>
