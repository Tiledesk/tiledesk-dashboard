<span class="dt-type-icon"
      [class.dt-type-icon--md]="size === 'md'"
      [attr.aria-hidden]="true">
  <mat-icon *ngIf="type === 'string'" class="dt-type-icon-mat">text_fields</mat-icon>
  <mat-icon *ngIf="type === 'number'" class="dt-type-icon-mat">numbers</mat-icon>
  <mat-icon *ngIf="type === 'boolean'" class="dt-type-icon-mat">check_box</mat-icon>
  <mat-icon *ngIf="type === 'datetime'" class="dt-type-icon-mat">calendar_today</mat-icon>
  <!-- Lucide hourglass (inline; project uses Material icons elsewhere) -->
  <svg *ngIf="type === 'ttl'"
       class="dt-type-icon-lucide"
       xmlns="http://www.w3.org/2000/svg"
       viewBox="0 0 24 24"
       fill="none"
       stroke="currentColor"
       stroke-width="2"
       stroke-linecap="round"
       stroke-linejoin="round"
       aria-hidden="true">
    <path d="M5 22h14"/>
    <path d="M5 2h14"/>
    <path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/>
    <path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>
  </svg>
</span>
