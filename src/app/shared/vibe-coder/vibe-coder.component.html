<div class="vibe-coder-wpr">
  <div class="vibe-coder" [class.vibe-coder--busy]="busy">
    <div class="vibe-coder__attachments" *ngIf="enableAttachments && attachments.length > 0">
      <div
        class="vibe-coder__attachment"
        *ngFor="let file of attachments; trackBy: trackAttachment"
        [class.vibe-coder__attachment--uploading]="file.uploading"
        [class.vibe-coder__attachment--error]="file.error">
        <div
          class="vibe-coder__attachment-icon"
          [attr.data-type]="typeLabel(file)"
          aria-hidden="true">
          <img
            *ngIf="isImageChip(file) && (file.previewUrl || file.url)"
            class="vibe-coder__attachment-thumb"
            [src]="file.previewUrl || file.url"
            alt="" />
          <span
            *ngIf="!(isImageChip(file) && (file.previewUrl || file.url))"
            class="material-icons vibe-coder__attachment-type-icon">
            {{ typeMaterialIcon(file) }}
          </span>
        </div>
        <div class="vibe-coder__attachment-meta">
          <div class="vibe-coder__attachment-name" [title]="file.name">{{ truncatedName(file.name) }}</div>
          <div class="vibe-coder__attachment-sub">
            <ng-container *ngIf="file.uploading">{{ 'VibeCoderUploading' | translate }}</ng-container>
            <ng-container *ngIf="!file.uploading && file.error">{{ 'VibeCoderUploadFailed' | translate }}</ng-container>
            <ng-container *ngIf="!file.uploading && !file.error">{{ typeLabel(file) }} · {{ sizeLabel(file) }}</ng-container>
          </div>
        </div>
        <button
          type="button"
          class="vibe-coder__attachment-remove"
          [disabled]="busy || isUploadingAttachments"
          (click)="removeAttachment(file.id); $event.stopPropagation()"
          [attr.aria-label]="'VibeCoderRemoveAttachment' | translate">
          <span class="material-icons" aria-hidden="true">close</span>
        </button>
      </div>
    </div>

    <textarea
      #vibeCoderTextarea
      class="vibe-coder__input"
      rows="2"
      [attr.maxlength]="maxLength"
      [(ngModel)]="buildPrompt"
      [disabled]="busy"
      [placeholder]="placeholder || ('VibeCoderPlaceholder' | translate: brandParams)"
      (input)="onTextareaInput(vibeCoderTextarea)"></textarea>

    <div class="vibe-coder__footer" [class.vibe-coder__footer--with-attach]="enableAttachments">
      <ng-container *ngIf="enableAttachments">
        <input
          #vibeCoderFileInput
          type="file"
          class="vibe-coder__file-input"
          [attr.accept]="fileAccept"
          multiple
          (change)="onFilesSelected($event)" />

        <button
          type="button"
          class="vibe-coder__attach"
          [disabled]="!canAttachMore"
          (click)="openFilePicker()"
          matTooltipClass="custom-mat-tooltip"
          [matTooltip]="'VibeCoderUploadFilesTooltip' | translate:{ max: maxAttachments, file_size_limit: maxFileMb }"
          matTooltipPosition="above"
          matTooltipHideDelay="100"
          [attr.aria-label]="'VibeCoderUploadFilesTooltip' | translate:{ max: maxAttachments, file_size_limit: maxFileMb }">
          <span class="material-icons" aria-hidden="true">add</span>
        </button>
      </ng-container>

      <button
        type="button"
        class="vibe-coder__start"
        [class.vibe-coder__start--ready]="(!requirePromptToStart || hasTypedContent) || isUploadingAttachments"
        [class.vibe-coder__start--loading]="isUploadingAttachments"
        [disabled]="!canStart"
        (click)="onStart()"
        [attr.aria-label]="'VibeCoderCreateAriaReady' | translate"
        [attr.aria-busy]="isUploadingAttachments">
        <span *ngIf="isUploadingAttachments" class="vibe-coder__start-spinner" aria-hidden="true"></span>
        <svg *ngIf="!isUploadingAttachments" xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" aria-hidden="true">
          <path d="M440-160v-487L216-423l-56-57 320-320 320 320-56 57-224-224v487h-80Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="vibe-coder__examples" *ngIf="!busy">
    <div class="vibe-coder__examples-label-row">
      <button
        type="button"
        class="vibe-coder__examples-label"
        *ngIf="hasMoreExamplePages; else examplesLabelOnly"
        (click)="refreshExamplePrompts()"
        [attr.aria-label]="'VibeCoderTryExamplePrompt' | translate">
        <span>{{ 'VibeCoderTryExamplePrompt' | translate }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" aria-hidden="true">
          <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/>
        </svg>
      </button>
      <ng-template #examplesLabelOnly>
        <span class="vibe-coder__examples-label vibe-coder__examples-label--static">
          {{ 'VibeCoderTryExamplePrompt' | translate }}
        </span>
      </ng-template>
    </div>

    <div class="vibe-coder__examples-cards">
      <button
        type="button"
        class="vibe-coder__example-card"
        *ngFor="let example of visibleExamplePrompts"
        (click)="applyExamplePrompt(example)">
        <span class="vibe-coder__example-card-text">{{ example.label }}</span>
      </button>
    </div>
  </div>

  <div class="vibe-coder__error" *ngIf="error">
    {{ error }}
  </div>
</div>
