<div class="vibe-coder-wpr">
  <div class="vibe-coder" [class.vibe-coder--busy]="busy">
    <textarea
      #vibeCoderTextarea
      class="vibe-coder__input"
      rows="1"
      [attr.maxlength]="maxLength"
      [(ngModel)]="buildPrompt"
      [disabled]="busy"
      [placeholder]="placeholder"
      (input)="onTextareaInput(vibeCoderTextarea)"></textarea>

    <div class="vibe-coder__footer">
      <button
        type="button"
        class="vibe-coder__start"
        [class.vibe-coder__start--ready]="hasTypedContent"
        [disabled]="!canStart"
        (click)="onStart()"
        [attr.aria-label]="canStart ? 'Create' : 'Enter a description to create'">
        <span class="vibe-coder__start-label" *ngIf="hasTypedContent">Create</span>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff" aria-hidden="true">
          <path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="vibe-coder__error" *ngIf="error">
    {{ error }}
  </div>
</div>
