<div class="vibe-coder-wpr">
  <div class="vibe-coder" [class.vibe-coder--busy]="busy">
    <textarea
      #vibeCoderTextarea
      class="vibe-coder__input"
      rows="2"
      [attr.maxlength]="maxLength"
      [(ngModel)]="buildPrompt"
      [disabled]="busy"
      [placeholder]="placeholder || ('VibeCoderPlaceholder' | translate)"
      (input)="onTextareaInput(vibeCoderTextarea)"></textarea>

    <div class="vibe-coder__footer">
      <button
        type="button"
        class="vibe-coder__start"
        [class.vibe-coder__start--ready]="hasTypedContent"
        [disabled]="!canStart"
        (click)="onStart()"
        [attr.aria-label]="'VibeCoderCreateAriaReady' | translate">
        <span class="vibe-coder__start-label" *ngIf="hasTypedContent">{{ 'VibeCoderCreate' | translate }}</span>
        <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" aria-hidden="true">
          <path d="M647-440H160v-80h487L423-744l57-56 320 320-320 320-57-56 224-224Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="vibe-coder__examples" *ngIf="!busy">
    <div class="vibe-coder__examples-label-row">
      <span class="vibe-coder__examples-label">{{ 'VibeCoderTryExamplePrompt' | translate }}</span>
      <!-- Refresh: cycle to another set of 3 examples when more prompts exist
      <button
        type="button"
        class="vibe-coder__examples-refresh"
        (click)="refreshExamplePrompts()"
        [attr.aria-label]="'Refresh' | translate">
        <svg xmlns="http://www.w3.org/2000/svg" height="18px" viewBox="0 -960 960 960" width="18px" aria-hidden="true">
          <path d="M480-160q-134 0-227-93t-93-227q0-134 93-227t227-93q69 0 132 28.5T720-690v-110h80v280H520v-80h168q-32-56-87.5-88T480-720q-100 0-170 70t-70 170q0 100 70 170t170 70q77 0 139-44t87-116h84q-28 106-114 173t-196 67Z"/>
        </svg>
      </button>
      -->
    </div>

    <div class="vibe-coder__examples-chips">
      <button
        type="button"
        class="vibe-coder__example-chip"
        *ngFor="let example of examplePrompts"
        (click)="applyExamplePrompt(example)">
        {{ example.labelKey | translate }}
      </button>
    </div>
  </div>

  <div class="vibe-coder__error" *ngIf="error">
    {{ error }}
  </div>
</div>
