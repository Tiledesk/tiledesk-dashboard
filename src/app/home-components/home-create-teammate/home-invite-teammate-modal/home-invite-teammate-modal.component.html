<h1 mat-dialog-title>
   {{ 'UsersPage.Invites' | translate }}
</h1>
<div mat-dialog-content>
    <form class="invite-teammate-form">
        <mat-form-field appearance="outline" class="mat--form-field" style="font-size:14px">
            <mat-label>{{ 'Email' | translate }}</mat-label>
            <input type="email" matInput [formControl]="emailFormControl" [(ngModel)]="teammateEmail">
            <mat-error *ngIf="emailFormControl.hasError('email') && !emailFormControl.hasError('required')">
                {{ 'Email must be a valid email' | translate }}
            </mat-error>
            <mat-error *ngIf="emailFormControl.hasError('required')">
                {{ 'Email is required.' | translate }}
            </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="mat--form-field" style="font-size:14px">
            <mat-label>{{ 'UsersPage.Role' | translate }}</mat-label>
            <select matNativeControl required #selectElem (change)="setSelected(selectElem.value)" [(ngModel)]="selectedRole" [formControl]="selectFormControl">
                <option [label]="'UserEditAddPage.SelectRole' | translate"></option>
                <option value="admin">{{ 'UserEditAddPage.Admin' | translate }}</option>
                <option value="agent">{{ 'UserEditAddPage.Agent' | translate }}</option>
                <option *ngFor="let role of roles" [value]="role.name">
                    {{ role.name }}
                </option>
              </select>
              <mat-error *ngIf="selectFormControl.hasError('required')">
                {{ 'FieldRequired' | translate }}
              </mat-error>
          </mat-form-field>
    </form>
</div>
<div mat-dialog-actions style="justify-content: center;">
    <button class="mat-dialog-close-btn" mat-button (click)="onNoClick()">
        {{ "Cancel" | translate }}
        <!-- Close -->
    </button>
    <!-- [disabled]="newKb.url.length === 0 || !isValidURL" -->
    <button [disabled]="emailFormControl.hasError('required') || emailFormControl.hasError('email') || selectFormControl.hasError('required')" 
        class="mat-dialog-ok-btn" mat-button
        (click)="onOkPresssed(teammateEmail)" cdkFocusInitial>
       
        {{ 'UserEditAddPage.Invites' | translate }}
    </button>
</div>
