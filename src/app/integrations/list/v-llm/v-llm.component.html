<div class="content">

  <div class="endpoints-header">
    <h4>{{ 'Integration.OpenAICompatibleEndpoints' | translate }}</h4>
    <button type="button" class="btn btn-tdblu-no-boxshadow" (click)="openAddEndpointDialog()">
      {{ 'Integration.AddEndpoint' | translate }}
    </button>
  </div>

  <vllm-endpoint-table
    [endpoints]="integration.value.servers"
    (onSelectEndpoint)="onSelectEndpoint($event)"
    (onDeleteEndpoint)="onDeleteEndpoint($event)">
  </vllm-endpoint-table>

</div>
