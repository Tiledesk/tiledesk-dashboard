<div class="content">

    <div class="form-section">
        <div class="form-header connector-detail-header">
            <img [src]="iconUrl" alt="{{ connectorItem?.name }}" class="connector-detail-icon" (error)="onIconError($event)">
            <h4>{{ connectorItem?.name }}</h4>
        </div>

        <div class="input-field">
            <label>URL</label>
            <p class="connector-detail-value">{{ connectorItem?.baseUrl }}</p>
        </div>

        <div class="tools-info-section" *ngIf="connectorItem">
            <div class="tools-badge-info">
                <span class="tools-label">{{ 'Actions' | translate }}:</span>
                <span class="tools-count-badge" [class.tools-count-badge--disabled]="!hasActions()" (click)="openActionsModal()">{{ connectorItem.actionCount || 0 }}</span>
            </div>
            <div class="tools-badge-info">
                <span class="tools-label">{{ 'Triggers' | translate }}:</span>
                <span class="tools-count-badge" [class.tools-count-badge--disabled]="!hasTriggers()" (click)="openTriggersModal()">{{ connectorItem.triggerCount || 0 }}</span>
            </div>
        </div>

        <div class="form-actions">
            <button class="btn btn-outlined" (click)="deleteConnector()">
                {{ 'Delete' | translate }}
            </button>
        </div>
    </div>

</div>
