<div class="m-header">
    <h1 mat-dialog-title>
        {{'CreateAnAIAgent' | translate}}
    </h1>
    <div class="m-top-right-icon" style="padding: 6px;">
        <span id="close" class="material-icons-outlined" (click)="onNoClick()">
            close
        </span>
    </div>
</div>

<div mat-dialog-content class="create-agent-modal__content">

    <div class="agent-type-field" *ngIf="showAgentTypeSelect">
        <label class="agent-type-field__label">{{ 'ChooseTheAgentType' | translate }}</label>
        <ng-select
            class="agent-type-select"
            appendTo="body"
            [items]="agentTypeOptions"
            bindLabel="label"
            bindValue="value"
            [(ngModel)]="subtype"
            (ngModelChange)="onAgentTypeChange($event)"
            [clearable]="false"
            [searchable]="false">
        </ng-select>
    </div>

    <mat-form-field appearance="outline" class="cc-mat-form-field">
        <mat-label>{{'ChatbotName' | translate}}</mat-label>
        <input matInput
            [(ngModel)]="agentName"
            (keydown.enter)="onNameEnter()"
            cdkFocusInitial>
        <mat-hint *ngIf="showPromptField && subtype === 'chatbot'">{{'AIAgentNameOptionalHint' | translate}}</mat-hint>
    </mat-form-field>

    <div class="create-agent-modal__vibe" *ngIf="showPromptField">
        <appdashboard-vibe-coder
            #modalVibeCoder
            [requirePromptToStart]="false"
            [enableAttachments]="true"
            [busy]="busy"
            (start)="onVibeStart($event)">
        </appdashboard-vibe-coder>
    </div>

</div>

<div mat-dialog-actions *ngIf="!showPromptField" style="justify-content: center;">
    <button class="mat-dialog-close-btn" mat-button (click)="onNoClick()">
        {{ "Cancel" | translate }}
    </button>

    <button [disabled]="!canCreate"
        class="mat-dialog-ok-btn" mat-button (click)="onCreate()">
        {{'Create' | translate}}
    </button>
</div>
