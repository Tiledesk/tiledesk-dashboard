<div class="m-header">
    <h1 mat-dialog-title>
        {{'CreateAnAIAgent' | translate}}
    </h1>

    <div class="m-top-right-icon">
        <span class="material-icons-outlined" (click)="onNoClick()">
            close
        </span>
    </div>
</div>

<div mat-dialog-content>

    <mat-form-field appearance="outline" class="cc-mat-form-field">
        <mat-label>{{'ChatbotName' | translate}}</mat-label>
        <input matInput
            [(ngModel)]="agentName"
            (keydown.enter)="onCreate()"
            cdkFocusInitial>
    </mat-form-field>

    <ng-container *ngIf="showPromptField">
        <mat-form-field appearance="outline" class="cc-mat-form-field">
            <mat-label>{{'AIAgentPromptLabel' | translate}}</mat-label>
            <textarea matInput
                rows="5"
                [(ngModel)]="agentPrompt"
                [maxlength]="maxPromptLength"
                placeholder="{{'AIAgentPromptPlaceholder' | translate}}"></textarea>
        </mat-form-field>

        <div class="agent-prompt-hint">
            {{'AIAgentPromptHint' | translate}}
        </div>
    </ng-container>

</div>

<div mat-dialog-actions style="justify-content: center;">
    <button class="mat-dialog-close-btn" mat-button (click)="onNoClick()">
        {{ "Cancel" | translate }}
    </button>

    <button [disabled]="!canCreate"
        class="mat-dialog-ok-btn" mat-button (click)="onCreate()">
        {{'Create' | translate}}
    </button>
</div>
