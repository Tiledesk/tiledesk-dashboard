<div class="graph-page-top"><monitor-tabs active="graph"></monitor-tabs></div>

<!-- no permission -->
<div *ngIf="permitted === false" class="unauthorized-message-container-in-page">
  <h2 class="unauthorized-page-title">{{ "UnauthorizedPage.UnauthorizedAccess" | translate }}</h2>
  <h3 class="unauthorized-page-subtitle">{{ "UnauthorizedPage.OopsYouDontHave" | translate }}</h3>
</div>

<!-- not configured: same message as the executions list -->
<div *ngIf="permitted !== false && !configured" class="exec-empty exec-not-configured">
  {{ "Executions.NotConfigured" | translate }}
</div>

<div *ngIf="permitted === true && configured" class="graph-page-body">
  <div *ngIf="error" class="graph-page-error">{{ "Monitor.Graph.LoadError" | translate }}</div>
  <execution-graph *ngIf="agents" [fill]="true" [projectId]="projectId" [projectName]="projectName" [agents]="agents" [range]="range">
    <!-- projected into the graph's toolbar, next to its Refresh button -->
    <div graph-toolbar class="graph-page-head">
      <label class="graph-range-label" for="graph-range">{{ "Executions.Graph.RangeLabel" | translate }}</label>
      <ng-select class="custom graph-range" labelForId="graph-range" [clearable]="false" [searchable]="false"
        [attr.aria-label]="'Executions.Graph.RangeLabel' | translate"
        [ngModel]="range" (ngModelChange)="setRange($event)">
        <ng-option *ngFor="let r of ranges" [value]="r">{{ "Executions.Graph.Range." + r | translate }}</ng-option>
      </ng-select>
    </div>
  </execution-graph>
</div>
