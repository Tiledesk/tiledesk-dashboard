    <!-- Spinner style from design-studio (cds-dashboard .loader) -->
    <style>
      .cds-boot-loader-wrap {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        z-index: 9999;
      }

      .cds-boot-loader {
        display: block;
        width: 100px;
        height: 100px;
        border: 3px solid #e06a58; /* CDS --base-brand-color */
        border-radius: 50%;
        animation: cds-boot-spin 7s ease-in-out infinite;
        transition-duration: 0.1s;
      }

      @keyframes cds-boot-spin {
        0% {
          transform: rotate(0deg);
          border-bottom: solid 3px transparent;
          border-top: solid 3px transparent;
        }
        50% {
          transform: rotate(1800deg);
          border: 3px solid #e06a58;
          border-left: solid 3px transparent;
          border-right: solid 3px transparent;
        }
        100% {
          transform: rotate(0deg);
          border-bottom: solid 3px transparent;
          border-top: solid 3px transparent;
        }
      }
    </style>
    <div class="cds-boot-loader-wrap" aria-busy="true" aria-live="polite">
      <div class="cds-boot-loader"></div>
    </div>
